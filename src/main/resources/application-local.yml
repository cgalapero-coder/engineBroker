server:
    address: ${SERVER_ADDRESS:127.0.0.1}
    port: ${SERVER_PORT:8092}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:${spring.application.name}-local}
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:3094}
        properties:
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: PLAIN
            sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:appuser}" password="${KAFKA_PASSWORD}";
