spring:
  application:
    name: engineBroker
  profiles:
    default: local

  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}

app:
  manage-database:
    request-topic: ${MANAGEDATABASE_REQUEST_TOPIC}
    response-topic: ${MANAGEDATABASE_RESPONSE_TOPIC}
    send-timeout: ${MANAGEDATABASE_SEND_TIMEOUT}
    response-timeout: ${MANAGEDATABASE_RESPONSE_TIMEOUT}
    dead-letter-suffix: ${KAFKA_DLT_SUFFIX}
    retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS}
    max-retries: ${KAFKA_MAX_RETRIES}

  research:
    ai-timeout: ${AI_TIMEOUT}
    ai:
      provider: ${AI_PROVIDER}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    com.gtech.automaticbroker.enginebroker: ${APP_LOG_LEVEL}
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
